<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo"></div>

    <nav class="nav-links" id="navLinks">

      <a href="#">Food</a>

  <!-- HERO SECTION -->
  <section class="hero">

        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus
        id est vitae dolor rhoncus tristique. Maecenas metus quam,

    <div class="hero-image">
      <img src="./assets/pexels-robinstickel-70497.jpg" alt="Burger" />

  <!-- GALLERY SECTION -->
  <section class="gallery">
    <div class="gallery-images">
      <img src="./assets/stageNeonLightSign.jpg" alt="Street food" />
      <img src="./assets/shrmip.jpg" alt="Restaurant" />
